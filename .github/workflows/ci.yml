name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: capnp
        run: sudo apt-get update && sudo apt-get install -y capnproto meson ninja-build python3-pytest
      - name: schema
        run: capnp compile -o- -Ischema schema/*.capnp >/dev/null
      - name: test
        run: cargo test --workspace
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: c abi
        run: |
          cargo build -p rgconf-c-abi
          gcc -Iinclude tests/c/abi_smoke.c -Ltarget/debug -lrgconf_c_abi -Wl,-rpath,target/debug -o target/abi_smoke
          ./target/abi_smoke
      - name: python
        run: |
          PYTHONPATH=python python3 -m pytest python/tests tools/test_parameter_map.py --junitxml=target/pytest.xml
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("target/pytest.xml").getroot()
          suite = root if root.tag == "testsuite" else root[0]
          total = int(suite.get("tests"))
          skipped = int(suite.get("skipped"))
          print(f"{total} collected, {skipped} skipped, {total - skipped} ran")
          sys.exit(0 if total - skipped > 0 else "no python tests ran")
          PY
      - name: docs
        run: |
          emacs --batch -l docs/export.el
          python3 tools/generate_llm_docs.py
          sphinx-build -b html -n docs/source docs/build
          git diff --exit-code
